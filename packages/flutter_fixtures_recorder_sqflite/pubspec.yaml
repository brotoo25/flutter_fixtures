name: flutter_fixtures_recorder_sqflite
description: "Sqflite adapter for the Flutter Fixtures record & replay module"
version: 0.1.0
homepage: https://github.com/brotoo25/flutter_fixtures
repository: https://github.com/brotoo25/flutter_fixtures
issue_tracker: https://github.com/brotoo25/flutter_fixtures/issues
documentation: https://github.com/brotoo25/flutter_fixtures#readme

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_fixtures_recorder: ^0.1.0
  flutter_fixtures_sqflite: ^0.2.0
  sqflite: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

topics:
  - mock
  - testing
  - fixtures
  - sqlite
