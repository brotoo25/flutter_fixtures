<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">flutter_fixtures</title>
  <desc id="desc">flutter_fixtures answers your app's HTTP and database requests from fixture files, an OpenAPI spec, or a recorded session. A GET /users request maps to GET_users.json, which offers Success 200, Empty 200 and Error 500 responses to choose from.</desc>

  <rect width="1200" height="420" rx="28" fill="#15121F"/>

  <!-- title block -->
  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#A78BFA">FLUTTER · MOCKING TOOLKIT</text>
    <text x="-3" y="164" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#F4F1F8">flutter_fixtures</text>
    <text x="0" y="216" font-size="26" fill="#CBC5DC">Answer your app's HTTP and database requests</text>
    <text x="0" y="252" font-size="26" fill="#CBC5DC">from fixture files, an OpenAPI spec, or a</text>
    <text x="0" y="288" font-size="26" fill="#CBC5DC">recorded session. No backend required.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B86A0">
      <text x="0" y="356">pub.dev  v0.3.1</text>
      <text x="176" y="356">·</text>
      <text x="204" y="356">MIT</text>
      <text x="262" y="356">·</text>
      <text x="290" y="356">Flutter 3.35+</text>
    </g>
  </g>

  <!-- project proof: request → fixture file → chosen response -->
  <g id="project-proof" transform="translate(708 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- request pill -->
    <rect x="0" y="0" width="176" height="42" rx="21" fill="#241F35" stroke="#3B3454" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#A78BFA"/>
    <text x="40" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#F4F1F8">GET /users</text>

    <!-- arrow to file name -->
    <path d="M186 21 H222" stroke="#5D5578" stroke-width="2" fill="none"/>
    <path d="M216 15 L224 21 L216 27" stroke="#5D5578" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="236" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#A78BFA">GET_users.json</text>

    <!-- fixture file card -->
    <rect x="0" y="66" width="428" height="212" rx="18" fill="#1E1A2D" stroke="#342E4A" stroke-width="1.5"/>
    <text x="24" y="98" font-size="18" fill="#8B86A0">Users List</text>
    <text x="404" y="98" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5D5578">3 responses</text>

    <!-- selected row -->
    <rect x="14" y="114" width="400" height="46" rx="12" fill="#2B2542"/>
    <circle cx="40" cy="137" r="9" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="40" cy="137" r="4.5" fill="#A78BFA"/>
    <text x="62" y="144" font-size="22" font-weight="600" fill="#F4F1F8">Success</text>
    <text x="392" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A78BFA">200</text>

    <!-- other rows -->
    <circle cx="40" cy="187" r="9" fill="none" stroke="#5D5578" stroke-width="2"/>
    <text x="62" y="194" font-size="22" fill="#B8B1CC">Empty</text>
    <text x="392" y="194" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B86A0">200</text>

    <circle cx="40" cy="237" r="9" fill="none" stroke="#5D5578" stroke-width="2"/>
    <text x="62" y="244" font-size="22" fill="#B8B1CC">Error</text>
    <text x="392" y="244" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B86A0">500</text>

    <!-- served response -->
    <path d="M40 278 V300" stroke="#5D5578" stroke-width="2" fill="none"/>
    <path d="M34 294 L40 302 L46 294" stroke="#5D5578" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B86A0"><tspan fill="#CBC5DC">200</tspan>  {"users": [{"id": 1, "name": "Alice"}]}</text>
  </g>
</svg>
